name: photography-session-deployment

services:

  postgresdb:
    image: postgres:16-alpine
    container_name: photography-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: photographydb

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d photographydb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - photography-network

  backend:
    image: viswasindhusri/docker-backend:latest

    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: photography-backend

    ports:
      - "2009:2008"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/photographydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

    depends_on:
      postgresdb:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - photography-network

volumes:
  postgres_data:

networks:
  photography-network:
    driver: bridge